[workspace]
resolver = "2"
members = [
    "crates/pii-scrubber",
    "crates/prompt-parsers",
    "crates/onet-engine",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Christian Gomez <christian@g3zcreative.com>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
