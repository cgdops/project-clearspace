name: Release Desktop Installers

on:
  push:
    branches:
      - master
      - main
    paths:
      - "package.json"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional release tag override (defaults to v<package.json version>)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  check-release:
    name: Check if Release Needed
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version & release gate
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${PKG_VER}"
          fi

          echo "version=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Always build on manual workflow_dispatch or explicit tag push
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On branch push, only build if this version's GitHub Release does not exist yet
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping installer build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $TAG detected; proceeding with release build."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release-windows:
    name: Build, Sign & Publish Windows Installers (x64)
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Sync version across workspace
        run: npm run version:sync

      - name: Build Tauri Desktop App & Installers
        run: npm --workspace=apps/desktop run tauri build

      - name: Stage installer artifacts & initial SHA-256 checksums
        run: npm run sync:downloads

      - name: Upload unsigned Windows installers for SignPath provenance
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installers
          path: |
            apps/web/public/downloads/Clearspace_*_x64-setup.exe
            apps/web/public/downloads/Clearspace_*_x64_en-US.msi
            apps/web/public/downloads/Clearspace_*_x64-portable.exe
          if-no-files-found: error

      - name: Check SignPath credentials availability
        id: signpath-gate
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORG_ID)) {
            Write-Output "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "SignPath credentials detected; proceeding with Authenticode code signing."
          } else {
            Write-Output "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "SIGNPATH_API_TOKEN / SIGNPATH_ORG_ID not configured yet; publishing unsigned SHA-256 verified installers."
          }

      - name: Submit signing request to SignPath.io
        if: steps.signpath-gate.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'clearspace' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/web/public/downloads

      - name: Recompute SHA-256 checksums & manifest after Authenticode signing
        if: steps.signpath-gate.outputs.enabled == 'true'
        run: node apps/web/scripts/sync-downloads.mjs --rehash-only --signed

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ needs.check-release.outputs.version }}"
          $tag = "${{ needs.check-release.outputs.tag }}"
          $files = @(
            "apps/web/public/downloads/Clearspace_${ver}_x64-setup.exe",
            "apps/web/public/downloads/Clearspace_${ver}_x64_en-US.msi",
            "apps/web/public/downloads/Clearspace_${ver}_x64-portable.exe",
            "apps/web/public/downloads/SHA256SUMS.txt",
            "apps/web/public/downloads/release-manifest.json",
            "apps/web/public/downloads/latest.json"
          ) | Where-Object { Test-Path $_ }

          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --target ${{ github.sha }} --title "Clearspace $tag" --generate-notes
          }
