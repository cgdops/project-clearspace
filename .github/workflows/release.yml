name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Installers (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Desktop App & Installers
        run: npm --workspace=apps/desktop run tauri build

      - name: Sync installer artifacts & SHA-256 checksums
        run: npm run sync:downloads

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag_name }}" -ne "") { "${{ github.event.inputs.tag_name }}" } else { "${{ github.ref_name }}" }
          $files = @(
            "apps/web/public/downloads/Clearspace_0.1.0_x64-setup.exe",
            "apps/web/public/downloads/Clearspace_0.1.0_x64_en-US.msi",
            "apps/web/public/downloads/Clearspace_0.1.0_x64-portable.exe",
            "apps/web/public/downloads/SHA256SUMS.txt",
            "apps/web/public/downloads/release-manifest.json"
          ) | Where-Object { Test-Path $_ }

          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "Clearspace $tag" --generate-notes
          }
